<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILIOLAB STUDIO LAUNCHER</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="launcher-wrapper">
        <div class="launcher-header header-flex">
            <div class="header-content">
                <img src="https://i.8upload.com/image/c8e20307e036c80a/chatgpt-image-may-25-2026-04-13-34-pm.png" alt="MILIOLAB Logo" class="app-logo">
                <div class="title-block">
                    <div class="logo-text">MILIOLAB.AI</div>
                    <div class="subtitle">TEMPLATE SHARE & WA GENERATOR • V5</div>
                </div>
            </div>
            <div class="header-actions">
                <a href="adm.html" class="admin-link" title="Kelola Paket">⚙️ Admin Paket</a>
                <button id="install-btn" class="admin-link hidden" onclick="installApp()" title="Install ke Homescreen">📲 Install App</button>
            </div>
        </div>

        <div class="launcher-body">
            <div class="panel">
                <div class="section-title">⚙️ Konfigurasi Akun</div>
                
                <div class="form-group">
                    <label for="paket">Pilih Paket:</label>
                    <select id="paket" onchange="toggleFields()">
                        <option>⏳ Memuat paket...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tanggal">Tanggal Aktif (Default Hari Ini):</label>
                    <input type="date" id="tanggal">
                </div>

                <div id="credential-fields" class="field-group"></div>

                <div id="links-fields" class="field-group"></div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="generateTemplate()">⚡ Generate Teks</button>
                </div>
            </div>

            <div class="panel">
                <div class="section-title">📄 Preview Teks</div>
                <textarea id="result" readonly placeholder="Hasil generate template akan muncul di sini..."></textarea>
                <button class="btn-secondary w-100 mt-10" onclick="copyToClipboard('result')">📋 Copy Teks</button>
            </div>

            <div class="panel">
                <div class="section-title">📲 WA Link Generator</div>
                
                <div class="wa-row">
                    <div class="form-group">
                        <label>Kode:</label>
                        <select id="wa-code">
                            <option value="62">+62 (ID)</option>
                            <option value="60">+60 (MY)</option>
                            <option value="65">+65 (SG)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label>No. WhatsApp (Tanpa 0):</label>
                        <input type="number" id="wa-phone" value="81216589695" placeholder="81216589695">
                    </div>
                </div>

                <div class="form-group">
                    <label>Pesan WA (Bisa diedit manual):</label>
                    <textarea id="wa-pesan" class="wa-textarea" placeholder="Pesan untuk customer..."></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="generateWaLink()">🔗 Buat Link WA</button>
                </div>

                <div class="form-group mt-10">
                    <input type="text" id="wa-result" readonly placeholder="https://wa.me/...">
                </div>

                <button class="btn-secondary w-100" onclick="copyToClipboard('wa-result')">📋 Copy Link WA</button>
                
                <button class="btn-action w-100 mt-10" onclick="insertLinkToTemplate()">↖️ Masukkan Link ke Template</button>
            </div>
        </div>
    </div>

    <div id="toast">✅ Aksi Berhasil!</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
