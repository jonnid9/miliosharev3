<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILIOLAB STUDIO LAUNCHER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="launcher-wrapper">
        <div class="launcher-header">
            <div class="header-content">
                <img src="https://i.8upload.com/image/c8e20307e036c80a/chatgpt-image-may-25-2026-04-13-34-pm.png" alt="MILIOLAB Logo" class="app-logo">
                <div class="title-block">
                    <div class="logo-text">MILIOLAB.AI</div>
                    <div class="subtitle">TEMPLATE SHARE & WA GENERATOR</div>
                </div>
            </div>
        </div>

        <div class="launcher-body">
            <div class="panel">
                <div class="section-title">⚙️ Konfigurasi Akun</div>
                
                <div class="form-group">
                    <label for="paket">Pilih Paket:</label>
                    <select id="paket" onchange="toggleFields()">
                        <option value="seedance">SEEDANCE PRIVATE</option>
                        <option value="veo_basic">FLOW VEO 3.1 BASIC LITE</option>
                        <option value="veo_pro">FLOW VEO 3.1 PRO FAST</option>
                        <option value="veo_ultimate">FLOW VEO 3.1 ULTIMATE FAST</option>
                        <option value="grok_basic">SUPER GROK BASIC</option>
                        <option value="grok_ultimate">SUPER GROK ULTIMATE</option>
                        <option value="happy_horse">HAPPY HORSE ULTIMATE</option>
                        <option value="suno">SUNO ULTIMATE UNLIMITED</option>
                        <option value="kling_basic">KLING MOTION CONTROL BASIC / ALL IN</option>
                        <option value="kling_pro">KLING MOTION CONTROL PRO / ALL IN</option>
                        <option value="kling_ultimate">KLING MOTION CONTROL ULTIMATE / ALL IN</option>
                        <option value="gpt">CHAT GPT PLUS PRIVATE</option>
                        <option value="capcut">CAPCUT PRO PRIVATE</option>
                        <option value="ext_basic">FLOW ULTRA VIP BASIC (EXTENSION)</option>
                        <option value="ext_pro">FLOW ULTRA VIP PRO (EXTENSION)</option>
                        <option value="ext_ultimate">FLOW ULTRA VIP ULTIMATE (EXTENSION)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tanggal">Tanggal Aktif (Default Hari Ini):</label>
                    <input type="date" id="tanggal">
                </div>

                <div id="private-fields" class="field-group">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="email@gmail.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="text" id="password" placeholder="password123">
                    </div>
                    <div class="form-group" id="field-link-akses">
                        <label for="link-akses">Link Akses:</label>
                        <input type="text" id="link-akses" value="https://dms-teknologi.com/">
                    </div>
                </div>

                <div id="extension-fields" class="field-group hidden">
                    <div class="form-group">
                        <label for="link-ext">Link Extension (PC/Laptop/Orion):</label>
                        <input type="text" id="link-ext" value="https://apps.texaproject.com/ext/TEKNO_APPS_v5.2.0_PROD.zip">
                    </div>
                    <div class="form-group">
                        <label for="link-apk">Link APK (Android):</label>
                        <input type="text" id="link-apk" value="https://dl.dropboxusercontent.com/scl/fi/klbw8aorlb4bwx14apim7/Tekno_Apps_5.2.0_release.apk?rlkey=goj9z7l24z932u6v6avw2c2ul&st=qzk0jj4w">
                    </div>
                    <div class="form-group">
                        <label for="link-kiwi">Link Kiwi Browser:</label>
                        <input type="text" id="link-kiwi" value="https://github.com/kiwibrowser/src.next/releases/download/14310011181/com.kiwibrowser.browser-arm64-14310011181-github.apk">
                    </div>
                    <div class="form-group">
                        <label for="kode-akses">Kode Akses:</label>
                        <input type="text" id="kode-akses" placeholder="MILIO-XXXX-XXXX">
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="generateTemplate()">⚡ Generate Teks</button>
                </div>
            </div>

            <div class="panel">
                <div class="section-title">📄 Preview Teks</div>
                <textarea id="result" readonly placeholder="Hasil generate template akan muncul di sini..."></textarea>
                <button class="btn-secondary w-100 mt-10" onclick="copyToClipboard('result')">📋 Copy Teks</button>
            </div>

            <div class="panel">
                <div class="section-title">📲 WA Link Generator</div>
                
                <div class="wa-row">
                    <div class="form-group">
                        <label>Kode:</label>
                        <select id="wa-code">
                            <option value="62">+62 (ID)</option>
                            <option value="60">+60 (MY)</option>
                            <option value="65">+65 (SG)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label>No. WhatsApp (Tanpa 0):</label>
                        <input type="number" id="wa-phone" value="81216589695" placeholder="81216589695">
                    </div>
                </div>

                <div class="form-group">
                    <label>Pesan WA (Bisa diedit manual):</label>
                    <textarea id="wa-pesan" class="wa-textarea" placeholder="Pesan untuk customer..."></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="generateWaLink()">🔗 Buat Link WA</button>
                </div>

                <div class="form-group mt-10">
                    <input type="text" id="wa-result" readonly placeholder="https://wa.me/...">
                </div>

                <button class="btn-secondary w-100" onclick="copyToClipboard('wa-result')">📋 Copy Link WA</button>
                
                <button class="btn-action w-100 mt-10" onclick="insertLinkToTemplate()">↖️ Masukkan Link ke Template</button>
            </div>
        </div>
    </div>

    <div id="toast">✅ Aksi Berhasil!</div>

    <script src="script.js"></script>
</body>
</html>
