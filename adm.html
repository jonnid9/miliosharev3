<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILIOLAB.AI — Admin Paket</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrapper {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .admin-body { padding: 30px; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .back-link:hover { color: var(--gold); }

        .pkg-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .pkg-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .pkg-info { display: flex; flex-direction: column; gap: 3px; }
        .pkg-title { font-weight: 700; color: var(--text-main); font-size: 14px; }
        .pkg-meta { font-size: 12px; color: var(--text-muted); }
        .pkg-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .pkg-actions button { padding: 8px 14px; font-size: 12px; }
        .btn-edit { background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.3); }
        .btn-edit:hover { background: rgba(59,130,246,0.3); }
        .btn-delete { background: rgba(239,68,68,0.15); color: #F87171; border: 1px solid rgba(239,68,68,0.3); }
        .btn-delete:hover { background: rgba(239,68,68,0.3); }

        .top-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .top-actions h2 { font-size: 18px; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px;
            overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #11141c;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 640px;
            padding: 26px;
        }
        .modal-box h3 { margin-bottom: 18px; color: var(--gold); }
        .row-2 { display: flex; gap: 12px; }
        .row-2 .form-group { flex: 1; }

        .links-box {
            border: 1px dashed var(--gold);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(255,215,0,0.04);
        }
        .links-box .section-title { font-size: 13px; margin-bottom: 12px; border: none; padding: 0; }
        .link-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            margin-bottom: 10px;
        }
        .link-row .form-group { flex: 1; margin-bottom: 0; }
        .link-row .btn-remove-link {
            flex-shrink: 0;
            padding: 12px 14px;
            background: rgba(239,68,68,0.15);
            color: #F87171;
            border: 1px solid rgba(239,68,68,0.3);
            font-size: 13px;
        }
        .link-row .btn-remove-link:hover { background: rgba(239,68,68,0.3); }
        .btn-add-link {
            background: rgba(255,215,0,0.1);
            color: var(--gold);
            border: 1px dashed var(--gold);
            width: 100%;
            padding: 10px;
            font-size: 13px;
        }
        .btn-add-link:hover { background: rgba(255,215,0,0.18); }

        .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; }
        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 99px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }
        .badge-private { background: rgba(59,130,246,0.15); color: #60A5FA; }
        .badge-sharing { background: rgba(255,215,0,0.15); color: var(--gold); }
        .badge-cred { background: rgba(255,255,255,0.08); color: var(--text-muted); }

        .lock-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            background-image: radial-gradient(circle at top left, var(--blue-glow), transparent 30%),
                              radial-gradient(circle at bottom right, var(--gold-glow), transparent 30%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .lock-box {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .lock-logo { height: 56px; margin-bottom: 14px; }
        .lock-title { font-size: 20px; font-weight: 800; color: var(--gold); letter-spacing: 1.5px; }
        .lock-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; margin-top: 4px; }
        .lock-error { color: #F87171; font-size: 13px; margin-top: 10px; min-height: 16px; }
    </style>
</head>
<body>

    <!-- LOCK SCREEN -->
    <div class="lock-overlay" id="lock-overlay">
        <div class="lock-box">
            <img src="https://i.8upload.com/image/c8e20307e036c80a/chatgpt-image-may-25-2026-04-13-34-pm.png" alt="MILIOLAB Logo" class="lock-logo">
            <div class="lock-title">ADMIN PAKET</div>
            <div class="lock-subtitle">Masukkan kode akses</div>
            <input type="password" id="lock-input" placeholder="Kode Akses" autocomplete="off" onkeydown="if(event.key==='Enter') checkPasscode()">
            <button class="btn-primary w-100 mt-10" onclick="checkPasscode()">🔓 Masuk</button>
            <div id="lock-error" class="lock-error"></div>
        </div>
    </div>

    <div class="admin-wrapper" id="admin-content" style="display:none;">
        <div class="launcher-header">
            <a href="index.html" class="back-link">← Kembali ke Generator</a>
            <div class="header-content" style="margin-top:6px;">
                <img src="https://i.8upload.com/image/c8e20307e036c80a/chatgpt-image-may-25-2026-04-13-34-pm.png" alt="MILIOLAB Logo" class="app-logo">
                <div class="title-block">
                    <div class="logo-text">ADMIN PAKET</div>
                    <div class="subtitle">KELOLA DATA PAKET • MILIO SHARE V5</div>
                </div>
            </div>
        </div>

        <div class="admin-body">
            <div class="top-actions">
                <h2>📦 Daftar Paket (<span id="pkg-count">0</span>)</h2>
                <button class="btn-primary" style="flex:none; padding:12px 20px;" onclick="openModal()">➕ Tambah Paket Baru</button>
            </div>

            <div id="pkg-list" class="pkg-list">
                <div class="empty-state">⏳ Memuat data paket...</div>
            </div>
        </div>
    </div>

    <!-- Modal Edit / Tambah -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">Tambah Paket Baru</h3>

            <div class="form-group">
                <label>Key (ID unik, huruf kecil & underscore, tanpa spasi):</label>
                <input type="text" id="f-key" placeholder="contoh: kling_basic">
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Kategori Paket:</label>
                    <select id="f-category">
                        <option value="private">Private</option>
                        <option value="sharing">Sharing</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipe Kredensial:</label>
                    <select id="f-credtype">
                        <option value="email_password">Email & Password</option>
                        <option value="kode_akses">Kode Akses</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Judul Header (muncul di "PENYERAHAN AKUN ...") & teks dropdown:</label>
                <input type="text" id="f-title" placeholder="contoh: KLING MOTION CONTROL 2.6 BASIC">
            </div>

            <div class="form-group">
                <label>Nama Paket (muncul di field "📦 Paket :"):</label>
                <input type="text" id="f-name" placeholder="contoh: KLING MOTION CONTROL BASIC 2.6">
            </div>

            <div class="links-box">
                <div class="section-title">🔗 Link (bebas, bisa tambah berapa pun — atau kosongin kalau paket ini gak butuh link)</div>
                <div id="links-container"></div>
                <button type="button" class="btn-add-link" onclick="addLinkRow()">➕ Tambah Link</button>
            </div>

            <div id="f-sharing-fields" class="hidden">
                <div class="row-2">
                    <div class="form-group">
                        <label>Server Info (mis. "Server 1–3"):</label>
                        <input type="text" id="f-serverinfo" placeholder="Server 1–3">
                    </div>
                    <div class="form-group">
                        <label>Jumlah Server:</label>
                        <input type="text" id="f-servercount" placeholder="3">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Body Template (Bonus / Detail Paket / Rules — boleh multi baris):</label>
                <textarea id="f-body" style="min-height: 200px;" placeholder="🎁 BONUS AKTIF
✅ ...
━━━━━━━━━━━━━━━
📌 DETAIL PAKET
🎬 ...
━━━━━━━━━━━━━━━
📌 RULES PEMAKAIAN
• ..."></textarea>
            </div>

            <div class="form-group">
                <label>Urutan Tampil (angka kecil tampil duluan):</label>
                <input type="number" id="f-sort" value="99">
            </div>

            <div class="modal-actions">
                <button class="btn-primary" style="flex:1;" onclick="savePackage()">💾 Simpan</button>
                <button class="btn-action" style="flex:1;" onclick="closeModal()">Batal</button>
            </div>
        </div>
    </div>

    <div id="toast">✅ Aksi Berhasil!</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://qxkrnkwapddyczbktfzk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hptilHcj8-JKBxa_5rX2Jw_6EQPboT8";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let packages = [];
        let linkRowCounter = 0;

        async function loadPackages() {
            const { data, error } = await sb
                .from('paket_templates')
                .select('*')
                .order('sort_order', { ascending: true });

            if (error) {
                document.getElementById('pkg-list').innerHTML = `<div class="empty-state">⚠️ Gagal memuat: ${error.message}</div>`;
                return;
            }

            packages = data;
            renderList();
        }

        function renderList() {
            document.getElementById('pkg-count').textContent = packages.length;
            const list = document.getElementById('pkg-list');

            if (packages.length === 0) {
                list.innerHTML = '<div class="empty-state">Belum ada paket. Klik "Tambah Paket Baru".</div>';
                return;
            }

            list.innerHTML = packages.map(p => `
                <div class="pkg-row">
                    <div class="pkg-info">
                        <div class="pkg-title">
                            ${p.title}
                            <span class="badge ${p.category === 'private' ? 'badge-private' : 'badge-sharing'}">${p.category}</span>
                            <span class="badge badge-cred">${p.cred_type === 'email_password' ? 'Email/Pass' : 'Kode Akses'}</span>
                        </div>
                        <div class="pkg-meta">key: ${p.key} • ${p.name} • ${(p.links || []).length} link</div>
                    </div>
                    <div class="pkg-actions">
                        <button class="btn-edit" onclick="openModal('${p.key}')">✏️ Edit</button>
                        <button class="btn-delete" onclick="deletePackage('${p.key}')">🗑️ Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        function addLinkRow(name = '', url = '') {
            linkRowCounter++;
            const id = linkRowCounter;
            const container = document.getElementById('links-container');
            const row = document.createElement('div');
            row.className = 'link-row';
            row.id = `link-row-${id}`;
            row.innerHTML = `
                <div class="form-group">
                    <label>Nama Link:</label>
                    <input type="text" class="link-name-input" placeholder="contoh: Link Akses" value="${name.replace(/"/g, '&quot;')}">
                </div>
                <div class="form-group">
                    <label>URL:</label>
                    <input type="text" class="link-url-input" placeholder="https://..." value="${url.replace(/"/g, '&quot;')}">
                </div>
                <button type="button" class="btn-remove-link" onclick="document.getElementById('link-row-${id}').remove()">🗑️</button>
            `;
            container.appendChild(row);
        }

        function clearLinkRows() {
            document.getElementById('links-container').innerHTML = '';
        }

        function openModal(key) {
            const modal = document.getElementById('modal-overlay');
            const titleEl = document.getElementById('modal-title');
            clearLinkRows();

            if (key) {
                const p = packages.find(x => x.key === key);
                titleEl.textContent = `Edit Paket: ${p.title}`;
                document.getElementById('f-key').value = p.key;
                document.getElementById('f-key').disabled = true;
                document.getElementById('f-category').value = p.category;
                document.getElementById('f-credtype').value = p.cred_type;
                document.getElementById('f-title').value = p.title;
                document.getElementById('f-name').value = p.name;
                document.getElementById('f-body').value = p.body || '';
                document.getElementById('f-serverinfo').value = p.server_info || '';
                document.getElementById('f-servercount').value = p.server_count || '';
                document.getElementById('f-sort').value = p.sort_order || 99;

                (p.links || []).forEach(l => addLinkRow(l.name, l.url));
            } else {
                titleEl.textContent = 'Tambah Paket Baru';
                document.getElementById('f-key').value = '';
                document.getElementById('f-key').disabled = false;
                document.getElementById('f-category').value = 'private';
                document.getElementById('f-credtype').value = 'email_password';
                document.getElementById('f-title').value = '';
                document.getElementById('f-name').value = '';
                document.getElementById('f-body').value = '';
                document.getElementById('f-serverinfo').value = '';
                document.getElementById('f-servercount').value = '';
                document.getElementById('f-sort').value = (packages.length + 1) * 10;

                addLinkRow('Link Akses', 'https://dms-teknologi.com/');
            }

            toggleSharingFields();
            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        function toggleSharingFields() {
            const category = document.getElementById('f-category').value;
            document.getElementById('f-sharing-fields').classList.toggle('hidden', category !== 'sharing');
        }
        document.getElementById('f-category').addEventListener('change', toggleSharingFields);

        function collectLinks() {
            const rows = document.querySelectorAll('#links-container .link-row');
            const links = [];
            rows.forEach(row => {
                const name = row.querySelector('.link-name-input').value.trim();
                const url = row.querySelector('.link-url-input').value.trim();
                if (name && url) links.push({ name, url });
            });
            return links;
        }

        async function savePackage() {
            const key = document.getElementById('f-key').value.trim().toLowerCase().replace(/\s+/g, '_');
            const category = document.getElementById('f-category').value;
            const credType = document.getElementById('f-credtype').value;
            const title = document.getElementById('f-title').value.trim();
            const name = document.getElementById('f-name').value.trim();

            if (!key || !title || !name) {
                showToast("Key, Judul, dan Nama Paket wajib diisi!");
                return;
            }

            const payload = {
                key, category, cred_type: credType, title, name,
                body: document.getElementById('f-body').value,
                links: collectLinks(),
                server_info: category === 'sharing' ? document.getElementById('f-serverinfo').value : null,
                server_count: category === 'sharing' ? document.getElementById('f-servercount').value : null,
                sort_order: parseInt(document.getElementById('f-sort').value) || 99
            };

            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ passcode: currentPasscode, action: 'save', payload })
            });
            const result = await res.json();

            if (!res.ok) {
                showToast("Gagal simpan: " + (result.error || 'Unknown error'));
                if (res.status === 401) handleInvalidPasscode();
                return;
            }

            showToast("✅ Paket tersimpan!");
            closeModal();
            loadPackages();
        }

        async function deletePackage(key) {
            const p = packages.find(x => x.key === key);
            if (!confirm(`Yakin mau hapus paket "${p.title}"? Tindakan ini tidak bisa dibatalkan.`)) return;

            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ passcode: currentPasscode, action: 'delete', key })
            });
            const result = await res.json();

            if (!res.ok) {
                showToast("Gagal hapus: " + (result.error || 'Unknown error'));
                if (res.status === 401) handleInvalidPasscode();
                return;
            }
            showToast("🗑️ Paket dihapus.");
            loadPackages();
        }

        function handleInvalidPasscode() {
            localStorage.removeItem(ADM_UNLOCK_KEY);
            showToast("Kode akses tersimpan tidak valid lagi, silakan login ulang.");
            setTimeout(() => location.reload(), 1500);
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(function () { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // ===== Lock screen =====
        const ADM_PASSCODE = "ommilio@2711";
        const ADM_UNLOCK_KEY = "milioshare_adm_passcode";
        let currentPasscode = null;

        function checkPasscode() {
            const input = document.getElementById('lock-input').value;
            if (input === ADM_PASSCODE) {
                localStorage.setItem(ADM_UNLOCK_KEY, input);
                currentPasscode = input;
                unlockAdmin();
            } else {
                document.getElementById('lock-error').textContent = "❌ Kode akses salah.";
                document.getElementById('lock-input').value = '';
                document.getElementById('lock-input').focus();
            }
        }

        function unlockAdmin() {
            document.getElementById('lock-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            loadPackages();
        }

        const storedPasscode = localStorage.getItem(ADM_UNLOCK_KEY);
        if (storedPasscode) {
            currentPasscode = storedPasscode;
            unlockAdmin();
        } else {
            document.getElementById('lock-input').focus();
        }
    </script>
</body>
</html>
