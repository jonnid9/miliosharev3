<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILIOLAB.AI — Admin Paket</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrapper {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .admin-body { padding: 30px; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .back-link:hover { color: var(--gold); }

        .pkg-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .pkg-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .pkg-info { display: flex; flex-direction: column; gap: 3px; }
        .pkg-title { font-weight: 700; color: var(--text-main); font-size: 14px; }
        .pkg-meta { font-size: 12px; color: var(--text-muted); }
        .pkg-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .pkg-actions button {
            padding: 8px 14px;
            font-size: 12px;
        }
        .btn-edit { background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.3); }
        .btn-edit:hover { background: rgba(59,130,246,0.3); }
        .btn-delete { background: rgba(239,68,68,0.15); color: #F87171; border: 1px solid rgba(239,68,68,0.3); }
        .btn-delete:hover { background: rgba(239,68,68,0.3); }

        .top-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .top-actions h2 { font-size: 18px; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px;
            overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #11141c;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 640px;
            padding: 26px;
        }
        .modal-box h3 { margin-bottom: 18px; color: var(--gold); }
        .row-2 { display: flex; gap: 12px; }
        .row-2 .form-group { flex: 1; }
        .ext-links-box {
            border: 1px dashed var(--gold);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(255,215,0,0.04);
        }
        .ext-links-box .section-title { font-size: 13px; margin-bottom: 12px; border: none; padding: 0; }
        .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
        .checkbox-row input { width: auto; }
        .checkbox-row label { margin: 0; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; }
        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 99px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-private { background: rgba(59,130,246,0.15); color: #60A5FA; }
        .badge-extension { background: rgba(255,215,0,0.15); color: var(--gold); }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <div class="launcher-header">
            <a href="index.html" class="back-link">← Kembali ke Generator</a>
            <div class="header-content" style="margin-top:6px;">
                <img src="https://i.8upload.com/image/c8e20307e036c80a/chatgpt-image-may-25-2026-04-13-34-pm.png" alt="MILIOLAB Logo" class="app-logo">
                <div class="title-block">
                    <div class="logo-text">ADMIN PAKET</div>
                    <div class="subtitle">KELOLA DATA PAKET • MILIO SHARE V4</div>
                </div>
            </div>
        </div>

        <div class="admin-body">
            <div class="top-actions">
                <h2>📦 Daftar Paket (<span id="pkg-count">0</span>)</h2>
                <button class="btn-primary" style="flex:none; padding:12px 20px;" onclick="openModal()">➕ Tambah Paket Baru</button>
            </div>

            <div id="pkg-list" class="pkg-list">
                <div class="empty-state">⏳ Memuat data paket...</div>
            </div>
        </div>
    </div>

    <!-- Modal Edit / Tambah -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">Tambah Paket Baru</h3>

            <div class="row-2">
                <div class="form-group">
                    <label>Key (ID unik, huruf kecil & underscore, tanpa spasi):</label>
                    <input type="text" id="f-key" placeholder="contoh: kling_basic">
                </div>
                <div class="form-group">
                    <label>Tipe Paket:</label>
                    <select id="f-type" onchange="toggleModalFields()">
                        <option value="private">Private (Email/Password)</option>
                        <option value="extension">Extension (Sharing/Link)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Judul Header (muncul di "PENYERAHAN AKUN ...") & teks dropdown:</label>
                <input type="text" id="f-title" placeholder="contoh: KLING MOTION CONTROL 2.6 BASIC">
            </div>

            <div class="form-group">
                <label>Nama Paket (muncul di field "📦 Paket :"):</label>
                <input type="text" id="f-name" placeholder="contoh: KLING MOTION CONTROL BASIC 2.6">
            </div>

            <div id="f-private-fields">
                <div class="checkbox-row">
                    <input type="checkbox" id="f-nolink" onchange="toggleModalFields()">
                    <label for="f-nolink">Paket ini TIDAK punya Link Akses (mis. ChatGPT, CapCut)</label>
                </div>
                <div class="form-group" id="f-linkakses-group">
                    <label>Default Link Akses:</label>
                    <input type="text" id="f-linkakses" placeholder="https://dms-teknologi.com/">
                </div>
                <div class="form-group">
                    <label>Body Template (Bonus / Detail Paket / Rules — boleh multi baris):</label>
                    <textarea id="f-body" style="min-height: 220px;" placeholder="🎁 BONUS AKTIF
✅ ...
━━━━━━━━━━━━━━━
📌 DETAIL PAKET
🎬 ...
━━━━━━━━━━━━━━━
📌 RULES PEMAKAIAN
• ..."></textarea>
                </div>
            </div>

            <div id="f-extension-fields" class="hidden">
                <div class="row-2">
                    <div class="form-group">
                        <label>Server Info (mis. "Server 1–3"):</label>
                        <input type="text" id="f-serverinfo" placeholder="Server 1–3">
                    </div>
                    <div class="form-group">
                        <label>Jumlah Server:</label>
                        <input type="text" id="f-servercount" placeholder="3">
                    </div>
                </div>
                <div class="ext-links-box">
                    <div class="section-title">🔗 3 Link Utama (sering update)</div>
                    <div class="form-group">
                        <label>Link Extension (PC/Laptop/Orion):</label>
                        <input type="text" id="f-linkext" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Link APK Android:</label>
                        <input type="text" id="f-linkapk" placeholder="https://...">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Link Kiwi Browser:</label>
                        <input type="text" id="f-linkkiwi" placeholder="https://...">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Urutan Tampil (angka kecil tampil duluan):</label>
                <input type="number" id="f-sort" value="99">
            </div>

            <div class="modal-actions">
                <button class="btn-primary" style="flex:1;" onclick="savePackage()">💾 Simpan</button>
                <button class="btn-action" style="flex:1;" onclick="closeModal()">Batal</button>
            </div>
        </div>
    </div>

    <div id="toast">✅ Aksi Berhasil!</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://qxkrnkwapddyczbktfzk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hptilHcj8-JKBxa_5rX2Jw_6EQPboT8";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let packages = [];
        let editingKey = null; // null = mode tambah baru

        async function loadPackages() {
            const { data, error } = await sb
                .from('paket_templates')
                .select('*')
                .order('sort_order', { ascending: true });

            if (error) {
                document.getElementById('pkg-list').innerHTML = `<div class="empty-state">⚠️ Gagal memuat: ${error.message}</div>`;
                return;
            }

            packages = data;
            renderList();
        }

        function renderList() {
            document.getElementById('pkg-count').textContent = packages.length;
            const list = document.getElementById('pkg-list');

            if (packages.length === 0) {
                list.innerHTML = '<div class="empty-state">Belum ada paket. Klik "Tambah Paket Baru".</div>';
                return;
            }

            list.innerHTML = packages.map(p => `
                <div class="pkg-row">
                    <div class="pkg-info">
                        <div class="pkg-title">
                            ${p.title}
                            <span class="badge ${p.type === 'private' ? 'badge-private' : 'badge-extension'}">${p.type}</span>
                        </div>
                        <div class="pkg-meta">key: ${p.key} • ${p.name}</div>
                    </div>
                    <div class="pkg-actions">
                        <button class="btn-edit" onclick="openModal('${p.key}')">✏️ Edit</button>
                        <button class="btn-delete" onclick="deletePackage('${p.key}')">🗑️ Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(key) {
            editingKey = key || null;
            const modal = document.getElementById('modal-overlay');
            const titleEl = document.getElementById('modal-title');

            if (key) {
                const p = packages.find(x => x.key === key);
                titleEl.textContent = `Edit Paket: ${p.title}`;
                document.getElementById('f-key').value = p.key;
                document.getElementById('f-key').disabled = true;
                document.getElementById('f-type').value = p.type;
                document.getElementById('f-title').value = p.title;
                document.getElementById('f-name').value = p.name;
                document.getElementById('f-nolink').checked = !!p.no_link;
                document.getElementById('f-linkakses').value = p.link_akses || '';
                document.getElementById('f-body').value = p.body || '';
                document.getElementById('f-serverinfo').value = p.server_info || '';
                document.getElementById('f-servercount').value = p.server_count || '';
                document.getElementById('f-linkext').value = p.link_ext || '';
                document.getElementById('f-linkapk').value = p.link_apk || '';
                document.getElementById('f-linkkiwi').value = p.link_kiwi || '';
                document.getElementById('f-sort').value = p.sort_order || 99;
            } else {
                titleEl.textContent = 'Tambah Paket Baru';
                document.getElementById('f-key').value = '';
                document.getElementById('f-key').disabled = false;
                document.getElementById('f-type').value = 'private';
                document.getElementById('f-title').value = '';
                document.getElementById('f-name').value = '';
                document.getElementById('f-nolink').checked = false;
                document.getElementById('f-linkakses').value = 'https://dms-teknologi.com/';
                document.getElementById('f-body').value = '';
                document.getElementById('f-serverinfo').value = '';
                document.getElementById('f-servercount').value = '';
                document.getElementById('f-linkext').value = '';
                document.getElementById('f-linkapk').value = '';
                document.getElementById('f-linkkiwi').value = '';
                document.getElementById('f-sort').value = (packages.length + 1) * 10;
            }

            toggleModalFields();
            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        function toggleModalFields() {
            const type = document.getElementById('f-type').value;
            const noLink = document.getElementById('f-nolink').checked;

            if (type === 'private') {
                document.getElementById('f-private-fields').classList.remove('hidden');
                document.getElementById('f-extension-fields').classList.add('hidden');
                document.getElementById('f-linkakses-group').style.display = noLink ? 'none' : 'block';
            } else {
                document.getElementById('f-private-fields').classList.add('hidden');
                document.getElementById('f-extension-fields').classList.remove('hidden');
            }
        }

        async function savePackage() {
            const key = document.getElementById('f-key').value.trim().toLowerCase().replace(/\s+/g, '_');
            const type = document.getElementById('f-type').value;
            const title = document.getElementById('f-title').value.trim();
            const name = document.getElementById('f-name').value.trim();

            if (!key || !title || !name) {
                showToast("Key, Judul, dan Nama Paket wajib diisi!");
                return;
            }

            const payload = {
                key, type, title, name,
                sort_order: parseInt(document.getElementById('f-sort').value) || 99
            };

            if (type === 'private') {
                payload.body = document.getElementById('f-body').value;
                payload.no_link = document.getElementById('f-nolink').checked;
                payload.link_akses = payload.no_link ? null : document.getElementById('f-linkakses').value;
                payload.server_info = null;
                payload.server_count = null;
                payload.link_ext = null;
                payload.link_apk = null;
                payload.link_kiwi = null;
            } else {
                payload.body = null;
                payload.no_link = false;
                payload.link_akses = null;
                payload.server_info = document.getElementById('f-serverinfo').value;
                payload.server_count = document.getElementById('f-servercount').value;
                payload.link_ext = document.getElementById('f-linkext').value;
                payload.link_apk = document.getElementById('f-linkapk').value;
                payload.link_kiwi = document.getElementById('f-linkkiwi').value;
            }

            const { error } = await sb.from('paket_templates').upsert(payload, { onConflict: 'key' });

            if (error) {
                showToast("Gagal simpan: " + error.message);
                console.error(error);
                return;
            }

            showToast("✅ Paket tersimpan!");
            closeModal();
            loadPackages();
        }

        async function deletePackage(key) {
            const p = packages.find(x => x.key === key);
            if (!confirm(`Yakin mau hapus paket "${p.title}"? Tindakan ini tidak bisa dibatalkan.`)) return;

            const { error } = await sb.from('paket_templates').delete().eq('key', key);

            if (error) {
                showToast("Gagal hapus: " + error.message);
                return;
            }
            showToast("🗑️ Paket dihapus.");
            loadPackages();
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(function () { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        loadPackages();
    </script>
</body>
</html>
